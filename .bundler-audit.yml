---
# Every advisory below is in a Rails gem, and each is fixed only in a later
# Rails than the one this app runs. They wait on the upgrade in issue 613.
# Ignoring them by id keeps this check failing on anything new. Delete each
# line as the upgrade passes the release that fixes it.
ignore:
  - GHSA-5957-c7qm-m469 # actionmailbox: Possible signature replay in Action Mailbox Mailgun ingress
  - GHSA-2586-8ghr-69fj # actionpack: Possible restoration of destroyed sessions in Action Dispatch CacheStore
  - GHSA-gmj8-hvj3-49mw # actionpack: Missing SameSite attribute on session cookies from Action Pack session stores
  - GHSA-r9jg-fmfx-2gv6 # actionpack: Possible cache poisoning in Action Pack content negotiation
  - GHSA-rwvh-fw6r-pwvp # actionpack: Possible DoS vulnerability in Action Controller Live streaming
  - GHSA-wm3x-v3qw-4jh3 # actionpack: Possible Strong Parameters bypass in Parameters#each_key in Action Pack
  - GHSA-x6mj-8jx9-qhqv # actionpack: Possible sensitive session information leak in Active Storage proxy mode
  - CVE-2026-33168 # actionview: Rails has a possible XSS vulnerability in its Action View tag helpers
  - GHSA-2p2f-4rq4-gjwc # actionview: Possible XSS vulnerability in Action View text helpers
  - GHSA-68p9-83h6-5wpj # actionview: Possible XSS vulnerability in Action View tag helpers
  - GHSA-rq8q-p985-fjq7 # actionview: Possible XSS vulnerability in Action View strip_tags
  - GHSA-v6rj-xm57-3p59 # actionview: Possible XSS vulnerability in Action View highlight helper
  - CVE-2026-122006 # activestorage: Possible arbitrary file write and read in Active Storage image analysis
  - CVE-2026-33173 # activestorage: Rails Active Storage has possible content type bypass via metadata in direct uploads
  - CVE-2026-33174 # activestorage: Rails Active Storage has a possible DoS vulnerability when in proxy mode via Range requests
  - CVE-2026-33195 # activestorage: Rails Active Storage has possible Path Traversal in DiskService
  - CVE-2026-33202 # activestorage: Rails Active Storage has possible glob injection in its DiskService
  - CVE-2026-33658 # activestorage: Rails Active Storage has a possible DoS vulnerability in proxy mode via multi-range requests
  - CVE-2026-66066 # activestorage: Possible arbitrary file read and remote code execution in Active Storage variant processing
  - GHSA-3f4q-8x5m-76v8 # activestorage: Possible local file disclosure in Active Storage video previews and analysis
  - GHSA-3w93-6hmw-whh4 # activestorage: Unsigned Content-Type in Active Storage GCS direct uploads with cache_control
