version: 2.1

orbs:
  browser-tools: circleci/browser-tools@2.4.2

references:
  install_imagemagick: &install_imagemagick
    run:
      name: Install ImageMagick
      command: sudo apt-get update && sudo apt-get install imagemagick libmagickcore-dev libmagickwand-dev
  install_node: &install_node
    run:
      name: Install Node
      # The image pins its own Node and this repo said nothing about it, so
      # CI built on whatever the image happened to ship. Read the version
      # .tool-versions already names, so there is one place to change.
      #
      # nvm is a shell function, not a command, and CircleCI runs each step
      # in a shell that never sources it. Unpack the official build instead
      # and put it first on the PATH through $BASH_ENV, which CircleCI does
      # source before every later step. The image's yarn is a script with a
      # `env node` shebang, so it follows this Node without being reinstalled.
      command: |
        node_version=$(awk '/^nodejs /{ print $2 }' .tool-versions)

        case "$(uname -m)" in
          x86_64) arch=x64 ;;
          aarch64) arch=arm64 ;;
          *) echo "No Node build for $(uname -m)"; exit 1 ;;
        esac

        url="https://nodejs.org/dist/v$node_version/node-v$node_version-linux-$arch.tar.xz"
        curl -fsSL --retry 3 "$url" -o /tmp/node.tar.xz
        sudo mkdir -p /opt/node
        sudo tar -xJf /tmp/node.tar.xz -C /opt/node --strip-components=1

        echo 'export PATH=/opt/node/bin:$PATH' >> "$BASH_ENV"
        source "$BASH_ENV"

        echo "node $(node --version) from $(command -v node)"
        echo "yarn $(yarn --version) from $(command -v yarn)"
  wait_for_postgres: &wait_for_postgres
    run:
      name: Wait for Postgres
      command: dockerize -wait tcp://localhost:5432 -timeout 1m
  # Gems go under vendor/bundle so there is one directory to cache. The key
  # carries the Ruby version as well as the lockfile, because a gem built for
  # one Ruby is useless to another: bundler installs per ABI directory, so a
  # cache from a different Ruby would restore and then be ignored.
  restore_gems: &restore_gems
    restore_cache:
      keys:
        - gems-v1-{{ checksum ".ruby-version" }}-{{ checksum "Gemfile.lock" }}
        - gems-v1-{{ checksum ".ruby-version" }}-
  save_gems: &save_gems
    save_cache:
      key: gems-v1-{{ checksum ".ruby-version" }}-{{ checksum "Gemfile.lock" }}
      paths:
        - vendor/bundle
  setup: &setup
    run:
      name: Set up the environment
      command: bin/setup
  precompile_assets: &precompile_assets
    run:
      name: Precompile the assets
      command: bin/rails assets:precompile
  run_tests: &run_tests
    run:
      name: Run the test suite
      command: COVERAGE=true bin/rake

jobs:
  build:
    working_directory: ~/radfords
    # Ruby 3.4 needs more than the 4 GB a medium container gives. On medium,
    # `bin/setup` drove RAM to 100% and the container was killed part way
    # through bundle install, every time, with no error in the log. Ruby 2.6
    # built the same gems inside 4 GB, so this is a cost of the new
    # interpreter rather than of anything this app asks for.
    resource_class: large
    docker:
      # Pinned to the exact patch in .ruby-version, so CI and this machine
      # run the same interpreter. A floating 3.4 tag would drift between them.
      #
      # Keep the -browsers variant. Its browsers really are unused, because the
      # orb below installs the Chrome for Testing the specs drive, and it costs
      # about half a gigabyte. It also carries yarn, which the plain image does
      # not and which the asset build needs, so dropping it fails the
      # precompile on "Yarn not installed". Slim this only together with
      # installing yarn beside Node below.
      - image: "cimg/ruby:3.4.11-browsers"
        environment:
          PGHOST: localhost
          PGUSER: radfords
          RAILS_ENV: test
          BUNDLE_PATH: vendor/bundle
      - image: "cimg/postgres:14.4"
        environment:
          POSTGRES_USER: radfords
          POSTGRES_DB: radfords_test
          POSTGRES_PASSWORD: ""
    steps:
      - checkout
      - <<: *install_imagemagick
      # Chrome for Testing ships a chromedriver built for the Chrome beside
      # it, both on the path. The image itself carries neither.
      - browser-tools/install_chrome_for_testing
      - <<: *install_node
      - <<: *wait_for_postgres
      - <<: *restore_gems
      - <<: *setup
      - <<: *save_gems
      - <<: *precompile_assets
      - <<: *run_tests
